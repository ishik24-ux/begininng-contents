<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b8b61">
<title>Begininng 教材サイト</title>
<style>
:root{
 --green:#0b8b61; --mint:#edf7f2; --beige:#f4eee5; --white:#fff;
 --text:#24231f; --muted:#746f67; --line:#e8e4dc; --bg:#fbfaf7;
 --shadow:0 10px 28px rgba(48,67,57,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{height:70px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}
.brand{font-weight:900;color:var(--green);font-size:22px}
.top-actions{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:13px;padding:10px 15px;background:var(--green);color:#fff;font-weight:800}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.soft{background:var(--mint);color:var(--green)}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:70px;height:calc(100vh - 70px)}
.navbtn{width:100%;border:0;background:transparent;border-radius:12px;padding:12px 14px;text-align:left;font-weight:750;color:var(--text);margin-bottom:6px}
.navbtn.active,.navbtn:hover{background:var(--mint);color:var(--green)}
.main{padding:30px;max-width:1280px;width:100%;margin:auto}
h1{font-size:28px;margin:0 0 8px} h2{font-size:20px;margin:0 0 14px} h3{margin:0}
.muted{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(3,1fr)}
.stat b{font-size:28px;color:var(--green);display:block;margin-top:6px}
.notice{border-left:5px solid var(--green)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0 14px}
.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.video-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--beige),var(--mint));display:grid;place-items:center}
.playcircle{width:54px;height:54px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--green);font-size:22px}
.video-body{padding:16px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--mint);color:var(--green);font-size:11px;font-weight:900}
.status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}
.status.done{background:var(--mint);color:var(--green)} .status.watching{background:var(--beige);color:#8b6a22}.status.todo{background:#f2f2f0;color:#777}
.course-toolbar{display:flex;gap:14px;justify-content:space-between;align-items:center;margin-bottom:20px}
.searchbox{max-width:360px;width:100%;position:relative}
.searchbox input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 42px 12px 14px}
.searchbox span{position:absolute;right:14px;top:11px;color:var(--muted)}
.course-category{border-radius:22px;overflow:hidden;margin-bottom:24px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.category-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:22px 24px;background:var(--mint);cursor:pointer}
.course-category.ai .category-head{background:var(--beige)}
.big-num{font-size:34px;line-height:1;font-weight:900;color:var(--green)}
.course-category.ai .big-num{color:#a8792c}
.chapter-meta{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.4px}
.toggle{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:20px;color:var(--green)}
.chapter-wrap{padding:14px}
.chapter{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.chapter-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 18px;background:#fbfdfc;cursor:pointer}
.chapter-head.level2{margin-left:24px;background:#fff}
.chapter-no{width:38px;height:38px;border-radius:11px;background:var(--mint);display:grid;place-items:center;color:var(--green);font-weight:900}
.chapter-title{font-weight:850;line-height:1.45}
.lesson-list{padding:0 14px 12px}
.lesson-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 6px;border-top:1px solid var(--line)}
.lesson-index{width:34px;height:34px;border-radius:9px;background:#f7f7f4;display:grid;place-items:center;font-weight:900;font-size:12px;color:var(--muted)}
.lesson-play{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--green);background:#fff;color:var(--green);display:grid;place-items:center}
.lesson-title{font-weight:800;line-height:1.45}
.lesson-summary{font-size:12px;color:var(--muted);line-height:1.55;margin-top:5px}
.lesson-meta{font-size:11px;color:var(--muted);margin-top:5px}
.lesson-actions{display:flex;align-items:center;gap:8px}
.heart{border:0;background:transparent;font-size:24px;color:#a9a9a4;padding:2px}.heart.on{color:#e55368}
.video-player{aspect-ratio:16/9;background:#111;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.video-player iframe{width:100%;height:100%;border:0}
.audio-player{background:var(--mint);border:1px solid #d6e9df;border-radius:20px;padding:28px;display:grid;gap:14px}
.audio-player audio{width:100%}
.drive-audio-frame{width:100%;height:180px;border:0;border-radius:12px;background:#fff}
.video-player-error{padding:28px;text-align:center;line-height:1.7}
.video-headline{margin:14px 0 18px;padding:16px 18px;border-radius:14px;background:var(--mint)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-weight:800}.tab.active{background:var(--mint);color:var(--green)}
textarea,input,select{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}textarea{width:100%}
.resource{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:10px}
.resource-icon{width:38px;height:38px;border-radius:10px;background:var(--mint);display:grid;place-items:center;color:var(--green);font-size:11px;font-weight:900}
.rating{display:flex;justify-content:center;gap:6px;font-size:34px}.star{border:0;background:transparent;color:#ccc;font-size:34px}.star.on{color:#f0b400}
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.admin-card b{display:block;font-size:28px;color:var(--green);margin-top:6px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.tree-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}.grow{flex:1}
.insight-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:20px;z-index:60}.modal-card{background:#fff;border-radius:20px;padding:22px;max-width:520px;width:100%;box-shadow:var(--shadow)}
.mobile-nav,.mobile-menu-btn,.mobile-drawer-head,.mobile-menu-overlay{display:none}
@media(max-width:980px){
 .layout{grid-template-columns:1fr}
 .main{padding:20px 16px 28px}
 .video-grid{grid-template-columns:1fr 1fr}
 .admin-grid{grid-template-columns:1fr 1fr}
 .mobile-menu-btn{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);padding:0;font-size:22px;font-weight:850;line-height:1}
 .mobile-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 16px;margin-bottom:8px;border-bottom:1px solid var(--line)}
 .mobile-drawer-head button{border:1px solid var(--line);border-radius:10px;background:#fff;width:38px;height:38px;font-size:20px}
 .sidebar{display:block;position:fixed;left:0;top:0;width:min(82vw,320px);height:100vh;padding:18px 14px;background:#fff;z-index:70;overflow-y:auto;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 20px 55px rgba(0,0,0,.18)}
 .sidebar.open{transform:translateX(0)}
 .mobile-menu-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s ease}
 .mobile-menu-overlay.open{opacity:1;pointer-events:auto}
 body.mobile-menu-open{overflow:hidden}
}
@media(max-width:650px){
 body{font-size:15px}
 .topbar{height:64px;padding:0 12px}
 .topbar .brand{font-size:18px}
 .top-actions{gap:6px}
 .top-actions .ghost{display:none}
 .top-actions .soft{padding:9px 11px;font-size:13px}
 .main{padding:18px 14px 26px}
 h1{font-size:23px;line-height:1.4}
 h2{font-size:18px;line-height:1.45}
 h3{font-size:16px;line-height:1.5}
 .btn{padding:9px 12px;font-size:13px}
 .muted{font-size:13px}
 .video-grid,.stats,.admin-grid{grid-template-columns:1fr}
 .course-toolbar{align-items:stretch;flex-direction:column}
 .searchbox{max-width:none}
 .category-head{grid-template-columns:1fr auto;padding:16px 14px}
 .category-head>div>div:first-child{font-size:17px!important;line-height:1.45}
 .chapter-head{grid-template-columns:minmax(0,1fr) auto;padding:13px 10px}
 .chapter-head.level2{margin-left:8px}
 .chapter-title{font-size:15px}
 .chapter-no{width:34px;height:34px;font-size:12px}
 .lesson-row{grid-template-columns:36px minmax(0,1fr);gap:7px;padding:12px 4px}
 .lesson-title{font-size:14px}
 .lesson-actions{grid-column:2;justify-content:flex-start;margin-top:2px}
 .lesson-summary{display:block;font-size:12px;line-height:1.6;margin-top:6px;color:var(--muted)}
 .video-headline{padding:13px 14px}
 .card{padding:16px;border-radius:16px}
}

/* Admin v2 */
.admin-section{margin-top:18px}
.admin-toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.invite-url{display:flex;gap:10px;align-items:center;margin-top:12px}
.invite-url input{flex:1;min-width:0;width:auto}
.status-pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}
.status-pill.pending{background:var(--beige);color:#8b6a22}
.status-pill.active{background:var(--mint);color:var(--green)}
.status-pill.disabled{background:#f1f1ef;color:#777}
.action-row{display:flex;gap:7px;flex-wrap:wrap}
.structure-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.structure-tree{min-height:480px}
.structure-node{border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px 12px;margin:8px 0}
.structure-node.child{margin-left:24px}
.structure-node.grandchild{margin-left:48px}
.node-head{display:flex;align-items:center;gap:10px}
.node-type{font-size:11px;font-weight:900;color:var(--green);background:var(--mint);border-radius:8px;padding:4px 7px}
.node-title{flex:1;font-weight:800}
.inline-form label{display:block;font-size:12px;font-weight:800;margin:11px 0 5px}
.inline-form input,.inline-form select,.inline-form textarea{width:100%}
.form-note{font-size:11px;color:var(--muted);margin-top:5px}
.auth-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.auth-step{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.auth-step b{display:block;color:var(--green);font-size:18px;margin-bottom:5px}
.demo-login{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:950px){.structure-grid{grid-template-columns:1fr}.auth-flow{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.invite-url{flex-direction:column;align-items:stretch}.auth-flow,.demo-login{grid-template-columns:1fr}}


/* Admin v3 clarity */
.admin-kicker{font-size:12px;font-weight:900;color:var(--green);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.admin-help{background:var(--mint);border:1px solid #dcefe5;border-radius:16px;padding:14px 16px;margin-top:14px}
.admin-help b{color:var(--green)}
.admin-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.admin-choice{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;cursor:pointer;transition:.15s}
.admin-choice:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.admin-choice .icon{width:46px;height:46px;border-radius:14px;background:var(--mint);display:grid;place-items:center;color:var(--green);font-size:22px;margin-bottom:10px}
.admin-choice h3{font-size:17px;margin-bottom:6px}
.admin-choice p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.video-manage-row{display:grid;grid-template-columns:minmax(0,1fr) 160px 120px 180px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.video-manage-row:last-child{border-bottom:0}
.visibility-btn{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;background:#fff}
.visibility-btn.public{background:var(--mint);color:var(--green);border-color:#cfe8dc}
.visibility-btn.private{background:var(--beige);color:#7f632d;border-color:#eadfcf}
.action-menu{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.section-separator{height:1px;background:var(--line);margin:18px 0}
@media(max-width:850px){
 .admin-choice-grid{grid-template-columns:1fr}
 .video-manage-row{grid-template-columns:1fr;gap:8px}
 .action-menu{justify-content:flex-start}
}


/* Admin v4 hierarchy tree */
.hierarchy-shell{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.hierarchy-tree{position:relative}
.h-row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:9px 0;background:#fff}
.h-row.level1{border-left:6px solid var(--green);background:var(--mint)}
.h-row.level2{margin-left:30px;border-left:4px solid #8fcdb3}
.h-row.level3{margin-left:60px;border-left:3px solid #b8dccd;background:#fcfdfc}
.h-row.video{margin-left:90px;border-left:2px solid #d7d7d2;background:#fff}
.h-row.level2:before,.h-row.level3:before,.h-row.video:before{
 content:"";position:absolute;left:-18px;top:-10px;bottom:50%;width:18px;border-left:1px solid #cfcfc8;border-bottom:1px solid #cfcfc8;border-bottom-left-radius:8px
}
.h-level{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;white-space:nowrap}
.level1 .h-level{background:var(--green);color:#fff}
.level2 .h-level{background:#dff1e9;color:var(--green)}
.level3 .h-level{background:#edf7f2;color:#507b68}
.video .h-level{background:#f2f2ef;color:#6f6f69}
.h-title{font-weight:850;line-height:1.4}
.h-sub{font-size:11px;color:var(--muted);margin-top:3px}
.h-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800}
.icon-btn.primary{background:var(--mint);color:var(--green)}
.selected-node{outline:2px solid rgba(11,139,97,.22)}
.detail-panel{position:sticky;top:92px}
.detail-path{font-size:12px;color:var(--muted);line-height:1.7;background:var(--bg);border-radius:12px;padding:11px}
@media(max-width:980px){.hierarchy-shell{grid-template-columns:1fr}.detail-panel{position:static}}
@media(max-width:700px){.h-row.level2{margin-left:14px}.h-row.level3{margin-left:28px}.h-row.video{margin-left:42px}.h-actions{grid-column:2 / 4;justify-content:flex-start}}


/* Admin v5 */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.role-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.role-tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;background:var(--mint);color:var(--green)}
.preview-shell{background:#f2f1ed;border:1px solid var(--line);border-radius:20px;padding:16px}
.preview-toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.preview-tabs,.device-tabs{display:flex;gap:7px;flex-wrap:wrap}
.preview-frame{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin:auto;transition:.2s}
.preview-frame.desktop{width:100%;min-height:620px}
.preview-frame.mobile{width:390px;max-width:100%;min-height:720px}
.preview-top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff}
.preview-sidebar-layout{display:grid;grid-template-columns:160px 1fr;min-height:560px}
.preview-side{border-right:1px solid var(--line);padding:14px 10px}
.preview-side div{padding:9px 10px;border-radius:9px;font-size:12px;font-weight:800;margin-bottom:5px}
.preview-side .active{background:var(--mint);color:var(--green)}
.preview-content{padding:18px}
.preview-video-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
@media(max-width:800px){.role-grid{grid-template-columns:1fr}.preview-sidebar-layout{grid-template-columns:1fr}.preview-side{display:none}}

/* Admin v6 drag & drop hierarchy */
.drag-handle{
  cursor:grab; user-select:none; font-size:18px; color:var(--muted);
  padding:2px 5px; border-radius:7px;
}
.drag-handle:active{cursor:grabbing}
.h-row.dragging{opacity:.45}
.h-row.drop-inside{outline:2px solid var(--green); background:var(--mint)}
.drop-line{
  height:6px; border-radius:999px; margin:2px 0; background:transparent;
  transition:.12s;
}
.drop-line.active{background:var(--green)}
.drag-help{
  display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;
  background:var(--beige); border:1px solid var(--line); border-radius:14px;
  padding:12px 14px; margin-top:12px; font-size:12px; color:var(--muted)
}
.drag-help b{color:var(--text)}
.undo-bar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--mint); border:1px solid #d7eadf; border-radius:14px;
  padding:10px 12px; margin-bottom:12px;
}


/* Admin v7 accordion structure overview */
.structure-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px
}
.summary-card{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px
}
.summary-card b{display:block;font-size:22px;color:var(--green);margin-top:5px}
.structure-controls{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px
}
.accordion-tree{margin-top:16px}
.acc-node{
  border:1px solid var(--line);border-radius:15px;background:#fff;margin:9px 0;overflow:hidden
}
.acc-node.level1{border-left:6px solid var(--green)}
.acc-node.level2{margin-left:22px;border-left:4px solid #9ed1ba}
.acc-node.level3{margin-left:44px;border-left:3px solid #c3dfd2}
.acc-node.level4{margin-left:66px;border-left:2px solid #d5e6de}
.acc-node.video{margin-left:88px;border-left:2px solid #ddd;background:#fcfcfb}
.acc-head{
  display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:12px 13px;cursor:pointer
}
.acc-head:hover{background:#fbfdfc}
.acc-toggle{
  width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:#fff;
  display:grid;place-items:center;color:var(--green);font-weight:900
}
.acc-level{
  font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;white-space:nowrap
}
.level1 .acc-level{background:var(--green);color:#fff}
.level2 .acc-level{background:#dff1e9;color:var(--green)}
.level3 .acc-level,.level4 .acc-level{background:var(--mint);color:#527864}
.video .acc-level{background:#f1f1ee;color:#777}
.acc-title{font-weight:850;line-height:1.45}
.acc-meta{font-size:11px;color:var(--muted);margin-top:4px}
.acc-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acc-body{padding:0 10px 10px}
.acc-video-row{

.acc-video-row .play{

}
.overview-note{
  background:var(--mint);border:1px solid #dcefe5;border-radius:14px;padding:12px 14px;

  padding:8px;

  overflow-x:auto;
  background:#fff;
}
.preview-frame.mobile .preview-side div{

function collectNodeVideoIds(node){
  let ids=[...(node.videos||[])];
  (node.children||[]).forEach(child=>ids=ids.concat(collectNodeVideoIds(child)));

function collectCategoryVideoIds(category){

function publishedAddedVideo(video,index){
 return {
  id:1000000+index,
  title:video.title,
  folder:video.parent||'',
  duration:video.duration||'',
  new:false,
  desc:video.summary||'',
  headline:video.headline||'',
  url:video.url||'',
  mediaType:video.mediaType||'video',
  resources:[
   ...(video.resourceUrl?[{type:'url',title:'関連資料',url:video.resourceUrl}]:[]),
   ...(video.pdf?[{type:'pdf',title:video.pdf}]:[])
  ]
 };
}
function rebuildStudentCourseData(){
 const baseVideos=videos.filter(video=>state.videoVisibility[video.id]!==false);
 const addedByTitle=new Map();
 state.addedVideos.forEach((video,index)=>{
  if(video.visibility==='非公開')return;
  const normalized=publishedAddedVideo(video,index);
  baseVideos.push(normalized);
  addedByTitle.set(video.title,normalized);
 });
 videos.splice(0,videos.length,...baseVideos);
 const hierarchyNodes=[...state.dragTree];
 state.customFolders.forEach((folder,index)=>{
  const parent=folder.parentId||folder.parent||null;
  const exists=hierarchyNodes.some(node=>node.type==='folder'&&node.title===folder.name&&((node.parent??null)===parent||node.id===folder.id));
  if(!exists)hierarchyNodes.push({id:folder.id||`legacy-folder-${index}`,type:'folder',title:folder.name,parent,order:index+1});
 });
 state.addedVideos.forEach((video,index)=>{
  if(video.visibility==='非公開')return;
  const exists=hierarchyNodes.some(node=>node.type==='video'&&node.title===video.title);
  if(!exists)hierarchyNodes.push({id:`legacy-video-${index}`,type:'video',title:video.title,parent:video.parentId||video.parent||null,order:index+1});
 });
 const folders=hierarchyNodes.filter(node=>node.type==='folder');
 const foldersById=new Map(folders.map(folder=>[folder.id,folder]));
 const resolveParentId=node=>{
  const parent=node.parent??null;
  if(parent===null||parent==='')return null;
  if(foldersById.has(parent))return parent;
  const parentName=String(parent).split(' / ').pop();
  return folders.find(folder=>folder.title===parent||folder.title===parentName)?.id??parent;
 };
 const childFolders=parent=>folders.filter(node=>resolveParentId(node)===parent).sort((a,b)=>(a.order||0)-(b.order||0));
 const videoIds=parent=>hierarchyNodes.filter(node=>node.type==='video'&&resolveParentId(node)===parent).sort((a,b)=>(a.order||0)-(b.order||0)).map(node=>{
  if(node.videoId!=null)return videos.find(video=>video.id===node.videoId)?.id;
  return addedByTitle.get(node.title)?.id;
 }).filter(id=>id!=null);
 const buildNode=folder=>({name:folder.title,children:childFolders(folder.id).map(buildNode),videos:videoIds(folder.id)});
 const categories=childFolders(null).map((root,index)=>({
  key:root.id||`course-${index}`,
  title:root.title,
  subtitle:'',
  nodes:childFolders(root.id).map(buildNode),
  videos:videoIds(root.id)
 }));
 courseCategories.splice(0,courseCategories.length,...categories);
 state.expanded={};
 categories.forEach(category=>state.expanded['cat-'+category.key]=false);
}

async function syncLegacyComments(){
 if(localStorage.getItem('beginning-comments-synced-v1')==='done')return;
 const pending=[];
 Object.entries(state.comments).forEach(([videoId,comments])=>{
  const video=videos.find(item=>String(item.id)===String(videoId));
  if(!video||!Array.isArray(comments))return;
  comments.forEach(body=>{if(String(body).trim())pending.push({videoId,videoTitle:video.title,body:String(body).trim()})});
 });
 for(const comment of pending){
  const response=await fetch('/api/comments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(comment)});
  if(!response.ok)return;
 }
 localStorage.setItem('beginning-comments-synced-v1','done');
}

function youtubeEmbedUrl(value){
 try{
  const url=new URL(String(value||'').trim());
  const host=url.hostname.replace(/^www\./,'').toLowerCase();
  let id='';
  if(host==='youtu.be')id=url.pathname.split('/').filter(Boolean)[0]||'';
  else if(host==='youtube.com'||host==='m.youtube.com'||host==='music.youtube.com'||host==='youtube-nocookie.com'){
   if(url.pathname==='/watch')id=url.searchParams.get('v')||'';
   else id=url.pathname.match(/^\/(?:embed|shorts|live)\/([^/?#]+)/)?.[1]||'';
  }
  return /^[A-Za-z0-9_-]{6,20}$/.test(id)?`https://www.youtube-nocookie.com/embed/${id}?rel=0`:'';
 }catch(error){return ''}
}
function googleDrivePreviewUrl(value){
 try{
  const url=new URL(String(value||'').trim());
  if(url.hostname.replace(/^www\./,'').toLowerCase()!=='drive.google.com')return '';
  const id=url.pathname.match(/\/file\/d\/([^/?#]+)/)?.[1]||url.searchParams.get('id')||'';
  return /^[A-Za-z0-9_-]{10,}$/.test(id)?`https://drive.google.com/file/d/${id}/preview`:'';
 }catch(error){return ''}
}

  const src=safeExternalUrl(v.url);
  return src?`<div class="audio-player"><div><span class="badge">音声教材</span><h2 style="margin:10px 0 0">${escapeHtml(v.title)}</h2></div><audio controls preload="metadata" src="${src}">お使いのブラウザは音声再生に対応していません。</audio></div>`:`<div class="audio-player"><b>音声URLを再生できません</b><div class="muted">Google Driveの共有URLまたは公開中の音声ファイルURLを確認してください。</div></div>`;
 }

 if(embed)return `<div class="video-player"><iframe src="${embed}" title="${String(v.title||'YouTube動画').replace(/"/g,'&quot;')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;

function urlBase64ToUint8Array(value){
 const padding='='.repeat((4-value.length%4)%4);
 const base64=(value+padding).replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(base64);return Uint8Array.from([...raw].map(char=>char.charCodeAt(0)));
}

  if(permission!=='granted')return alert('通知が許可されませんでした。ブラウザ設定をご確認ください。');
  const registration=await navigator.serviceWorker.register('/sw.js');
  const keyResponse=await fetch('/api/push');if(!keyResponse.ok)throw new Error('public_key_failed');
  const {publicKey}=await keyResponse.json();if(!publicKey)throw new Error('push_not_configured');
  let subscription=await registration.pushManager.getSubscription();

  const response=await fetch('/api/push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription})});
  if(!response.ok)throw new Error('subscription_failed');
  alert('この端末へのプッシュ通知を有効にしました。');
 }catch(error){alert('通知設定を完了できませんでした。管理者へお問い合わせください。')}

let treeIndex=null;
function invalidateTreeIndex(){treeIndex=null}
function getTreeIndex(){
 initDragTree();
 if(treeIndex)return treeIndex;
 const nodes=new Map(),children=new Map();
 state.dragTree.forEach(n=>{
  nodes.set(n.id,n);
  const parent=n.parent??null;
  if(!children.has(parent))children.set(parent,[]);
  children.get(parent).push(n);
 });
 children.forEach(list=>list.sort((a,b)=>a.order-b.order));
 treeIndex={nodes,children};
 return treeIndex;
}
function getChildren(parentId){
 return getTreeIndex().children.get(parentId??null)||[];
}
function getNode(id){return getTreeIndex().nodes.get(id)}
function getDepth(id){
 let d=1,n=getNode(id);
 while(n && n.parent){d++; n=getNode(n.parent)}
 return d;
}
function isDescendant(candidateId,ancestorId){
 let n=getNode(candidateId);
 while(n && n.parent){
  if(n.parent===ancestorId)return true;
  n=getNode(n.parent);
 }
 return false;
}
function normalizeOrders(parentId){
 getChildren(parentId).forEach((n,i)=>n.order=i+1);
}
function moveStructureNode(id,direction){
 const node=getNode(id);
 if(!node)return;
 const siblings=[...getChildren(node.parent)];
 const index=siblings.findIndex(n=>n.id===id);
 const nextIndex=index+direction;
 if(index<0||nextIndex<0||nextIndex>=siblings.length)return;
 snapshotTree();
 const other=siblings[nextIndex];
 const currentOrder=node.order;
 node.order=other.order;
 other.order=currentOrder;
 invalidateTreeIndex();
 state.selectedStructureNode={level:node.type==='video'?'video':getDepth(node.id),name:node.title,path:buildPath(node.id)};
 render();
}
function snapshotTree(){
 state.dragSnapshot = JSON.stringify(state.dragTree);
}
function undoTree(){
 if(!state.dragSnapshot)return;
 state.dragTree = JSON.parse(state.dragSnapshot);
 invalidateTreeIndex();
 state.dragSnapshot = null;
 render();
}
function startDrag(ev,id){
 snapshotTree();
 state.dragNodeId=id;
 ev.dataTransfer.effectAllowed='move';
 ev.dataTransfer.setData('text/plain',id);
 requestAnimationFrame(()=>ev.currentTarget.classList.add('dragging'));
}
function endDrag(ev){
 ev.currentTarget.classList.remove('dragging');
 document.querySelectorAll('.drop-line').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.h-row').forEach(x=>x.classList.remove('drop-inside'));
 state.dragNodeId=null;
}
function allowDrop(ev){ev.preventDefault();ev.dataTransfer.dropEffect='move'}
function dragOverLine(ev){
 ev.preventDefault();ev.currentTarget.classList.add('active');
}
function dragLeaveLine(ev){ev.currentTarget.classList.remove('active')}
function dropBefore(ev,targetId){
 ev.preventDefault();ev.stopPropagation();
 const draggedId=state.dragNodeId||ev.dataTransfer.getData('text/plain');
 if(!draggedId || draggedId===targetId)return;
 const dragged=getNode(draggedId), target=getNode(targetId);
 if(!dragged||!target)return;
 const oldParent=dragged.parent;
 dragged.parent=target.parent;
 invalidateTreeIndex();
 const siblings=getChildren(target.parent).filter(n=>n.id!==draggedId);
 const idx=siblings.findIndex(n=>n.id===targetId);
 siblings.splice(idx,0,dragged);
 siblings.forEach((n,i)=>n.order=i+1);
 normalizeOrders(oldParent);
 invalidateTreeIndex();
 state.selectedStructureNode={level:dragged.type==='video'?'video':getDepth(dragged.id),name:dragged.title,path:buildPath(dragged.id)};
 render();
}
function dragOverInside(ev,targetId){
 ev.preventDefault();ev.stopPropagation();
 const draggedId=state.dragNodeId;
 const target=getNode(targetId);
 if(!draggedId||!target||target.type==='video'||draggedId===targetId||isDescendant(targetId,draggedId))return;
 ev.currentTarget.classList.add('drop-inside');
}
function dragLeaveInside(ev){ev.currentTarget.classList.remove('drop-inside')}
function dropInside(ev,targetId){
 ev.preventDefault();ev.stopPropagation();
 const draggedId=state.dragNodeId||ev.dataTransfer.getData('text/plain');
 const dragged=getNode(draggedId),target=getNode(targetId);
 if(!dragged||!target||target.type==='video'||draggedId===targetId||isDescendant(targetId,draggedId))return;
 const oldParent=dragged.parent;
 dragged.parent=targetId;
 invalidateTreeIndex();
 dragged.order=getChildren(targetId).filter(n=>n.id!==draggedId).length+1;
 normalizeOrders(oldParent); normalizeOrders(targetId);
 invalidateTreeIndex();
 state.selectedStructureNode={level:dragged.type==='video'?'video':getDepth(dragged.id),name:dragged.title,path:buildPath(dragged.id)};
 render();
}
function buildPath(id){
 const parts=[]; let n=getNode(id);
 while(n){parts.unshift(n.title);n=n.parent?getNode(n.parent):null}
 return parts.join(' / ');
}

function deleteFolder(id){
 const node=getNode(id);
 if(!node||node.type!=='folder')return;
 const descendants=collectDescendantIds(id);
 const folderCount=descendants.filter(childId=>getNode(childId)?.type==='folder').length;
 const videoCount=descendants.filter(childId=>getNode(childId)?.type==='video').length;

 if(!confirm(`「${node.title}」を削除しますか？${detail}`))return;
 snapshotTree();
 const oldParent=node.parent;
 const removeIds=new Set([id,...descendants]);
 const removedTitles=new Set(state.dragTree.filter(item=>removeIds.has(item.id)).map(item=>item.title));
 state.dragTree=state.dragTree.filter(item=>!removeIds.has(item.id));
 invalidateTreeIndex();
 state.customFolders=state.customFolders.filter(f=>!removedTitles.has(f.name));
 state.addedVideos=state.addedVideos.filter(v=>!removedTitles.has(v.title));
 normalizeOrders(oldParent);
 state.selectedStructureNode={level:1,name:'',path:''};
 render();
}

function dropAtEnd(ev,parentId){
 ev.preventDefault();
 ev.stopPropagation();
 const draggedId=state.dragNodeId||ev.dataTransfer.getData('text/plain');
 const dragged=getNode(draggedId);
 if(!dragged||draggedId===parentId||isDescendant(parentId,draggedId))return;
 const oldParent=dragged.parent;
 dragged.parent=parentId;
 invalidateTreeIndex();
 dragged.order=getChildren(parentId).filter(n=>n.id!==draggedId).length+1;
 normalizeOrders(oldParent);normalizeOrders(parentId);
 invalidateTreeIndex();
 state.selectedStructureNode={level:dragged.type==='video'?'video':getDepth(dragged.id),name:dragged.title,path:buildPath(dragged.id)};
 render();
}

function renderNodeRecursive(node,level,parentPath,index){
 const clean=node.name.replace(/^\d+｜/,'');
 const path=parentPath+' / '+clean;
 let html=hierarchySimpleRow(level,clean,`${(node.videos||[]).length}本の動画`,path,'');
 (node.children||[]).forEach((c,i)=>{html+=renderNodeRecursive(c,Math.min(level+1,4),path,i+1)});
 (node.videos||[]).slice(0,3).forEach(id=>{
   const v=videos.find(x=>x.id===id);
   if(v)html+=hierarchyVideoRow(v.title,path,'');
 });
 if((node.videos||[]).length>3){
   html+=`<div class="muted" style="margin-left:${level===2?'90':'120'}px;font-size:11px;padding:4px 0">ほか ${(node.videos||[]).length-3} 本</div>`;
 }
 return html;
}

async function sendResetMail(){
 const email=document.getElementById('resetEmail').value.trim();
 if(!email)return alert('メールアドレスを入力してください');
 const button=document.getElementById('resetRequestButton');
 const message=document.getElementById('resetRequestMessage');
 button.disabled=true;button.textContent='送信中…';message.textContent='';
 try{
  const response=await fetch('/api/password-reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'request',email})});
  if(!response.ok){const result=await response.json().catch(()=>({}));throw new Error(result.error||'request_failed')}
  state.passwordResetEmail=email;
  adminModalBody.innerHTML=`<div class="auth-card"><div class="invite-state unused">送信完了</div><h2 style="margin-top:12px">メールをご確認ください</h2><p class="muted">${escapeHtml(email)} が登録済みの場合、パスワード再設定メールが届きます。メール内のリンクは1時間有効です。</p><button class="btn ghost" style="width:100%;margin-top:14px" onclick="closeAdminModal()">閉じる</button></div>`;
 }catch(error){
  button.disabled=false;button.textContent='再設定メールを送信';
  message.textContent=error.message==='email_unavailable'?'現在メールを送信できません。サイト管理者へお問い合わせください。':'送信できませんでした。通信状態を確認して、もう一度お試しください。';
  message.style.color='#b42318';
 }

async function completePasswordResetFromLink(token){
 const password=document.getElementById('resetNewPassword').value;
 const confirmPassword=document.getElementById('resetNewPasswordConfirm').value;
 const message=document.getElementById('resetCompleteMessage');
 if(password.length<8){message.textContent='8文字以上のパスワードを入力してください。';message.style.color='#b42318';return}
 if(password!==confirmPassword){message.textContent='確認用パスワードが一致しません。';message.style.color='#b42318';return}
 const button=document.getElementById('resetCompleteButton');button.disabled=true;button.textContent='更新中…';
 try{
  const response=await fetch('/api/password-reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'reset',token,password})});
  if(!response.ok){const result=await response.json().catch(()=>({}));throw new Error(result.error||'reset_failed')}
  document.querySelector('main').innerHTML=`<div class="card"><div class="invite-state unused">更新完了</div><h1 style="margin-top:16px">パスワードを更新しました</h1><p class="muted">新しいパスワードでログインできます。</p><a class="btn" style="display:inline-block;text-decoration:none;margin-top:12px" href="/login">講座生ログインへ</a></div>`;
 }catch(error){

  message.style.color='#b42318';
 }
}

   if(account.role===state.loginRole){state.isAuthenticated=true;state.role=account.role;state.currentUserName=account.name;state.page=account.role==='admin'?'adminHome':'home';if(account.role==='admin')await loadAdminData();else await loadStudentData()}
  }
 }catch(e){}
 render();
}
function renderInviteLanding(token){
 document.body.innerHTML=`<main style="max-width:520px;margin:8vh auto;padding:20px"><div class="card"><div class="brand">Begininng 教材サイト</div><h1 style="margin-top:18px">講座生の参加申請</h1><p class="muted">お名前・メールアドレス・パスワードを登録してください。管理者承認後にログインできます。</p><div class="inline-form"><label>名前</label><input id="inviteName"><label>メールアドレス</label><input id="inviteEmail" type="email"><label>パスワード（8文字以上）</label><input id="invitePassword" type="password"><button class="btn" style="width:100%;margin-top:18px" onclick="submitInviteRegistration('${token}')">登録して参加申請</button><p id="inviteMessage" class="muted"></p></div></div></main>`;
}
async function submitInviteRegistration(token){const name=inviteName.value.trim(),email=inviteEmail.value.trim(),password=invitePassword.value;const response=await fetch('/api/invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'register',token,name,email,password})});inviteMessage.textContent=response.ok?'参加申請を受け付けました。管理者の承認をお待ちください。':'招待URLが無効か、入力内容に不足があります。';if(response.ok)document.querySelector('button').disabled=true}
const inviteToken=location.pathname.match(/^\/invite\/([^/]+)/)?.[1];
const resetToken=new URLSearchParams(location.search).get('resetToken');
if(inviteToken)renderInviteLanding(inviteToken);else if(resetToken)renderPasswordResetLanding(resetToken);else{setLoginRole(loginRoleFromPath());restoreSession()}
</script>
